    <script>
      // Fix: Ensure window.fetch has a setter so scripts like formdata-polyfill / Vite clients do not throw
      // "Cannot set property fetch of #<Window> which has only a getter" when iframe wrappers define getter-only fetch.
      (function() {
        try {
          let _customFetch = null;
          const currentDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (currentDesc && currentDesc.get && !currentDesc.set) {
            const origGet = currentDesc.get;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return _customFetch || origGet.call(this);
              },
              set: function(val) {
                _customFetch = val;
              }
            });
          }

          const origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if ((obj === window || obj === globalThis) && prop === 'fetch') {
              const origGet = descriptor && descriptor.get;
              return origDefineProperty.call(this, obj, prop, {
                configurable: true,
                enumerable: true,
                get: function() {
                  return _customFetch || (origGet ? origGet.call(this) : window.fetch);
                },
                set: function(val) {
                  _customFetch = val;
                }
              });
            }
            return origDefineProperty.apply(this, arguments);
          };
        } catch (err) {
          console.warn('Fetch setter patch error:', err);
        }
      })();
    </script>
